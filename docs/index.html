d structural accounts situate heavy drug use within cultural norms and unequal distributions of power.\n\nSigns and symptoms\nImpaired control over the substance or behavior is the core feature. It appears as using more or for longer than intended, persistent unsuccessful attempts to cut down, and a great deal of time spent obtaining, using, or recovering. Social impairment follows, with failure to meet obligations at work, school, or home, and the abandonment of former activities. Risky use (continuing despite knowledge of physical or psychological harm) and, for many substances, tolerance and withdrawal, complete the picture.\n\nComplications\n\nAddiction carries a substantial risk of further illness and of early death. The most immediate danger is overdose, which for opioids and other sedatives acts by suppressing breathing. Injecting drug use also carries a risk of blood-borne infection, including HIV and hepatitis C. Long-term use damages particular organ systems depending on the substance, with liver cirrhosis and cognitive impairment following sustained heavy drinking and lung disease following tobacco smoking.: ch. 1 \n\nPsychiatric conditions frequently co-occur with addiction, and each worsens the outlook for the other, so current guidance is that both be treated at the same time rather than one after the other. People with substance use disorders also die by suicide considerably more often than the general population; a systematic review and meta-analysis of 47 cohort studies estimated the rate at roughly five times that expected, with raised risk found for alcohol, tobacco, opioid, cannabis, and amphetamine use and a stronger association in women than in men, although estimates varied widely between the studies pooled. Loss of pleasure in ordinary activities (anhedonia) is common and is associated with mood disorders.\n\nTypes\nAddiction is described in two broad forms: substance use disorders, which involve psychoactive drugs, and behavioral addictions, which involve activities that produce reward without a drug. Whether some patterns of eating meet the criteria for addiction remains disputed.\n\nSubstance use disorder\nThe DSM-5 discourages using the term drug addiction because of its \"uncertain definition and its potentially negative connotation\" and prefers the term substance use disorder to describe the wide range of the disorder, from a mild form to a severe state of chronically relapsing, compulsive pattern of drug taking.\n\nSubstance use disorder is one of the substance-related disorders. It is a long-term, relapsing condition in which a person continues seeking and taking a substance despite the harm it causes. Repeated use alters the brain circuits that handle reward, stress and self-control, which is why cutting down becomes harder over time. The substances most often involved are alcohol, nicotine, cannabis, opioids, cocaine and amphetamines. Use may begin socially, or follow from a prescribed medication. No single theory accounts for substance use disorder on its own. Phenomenological, operant and classical conditioning, cognitive, and cue reactivity models each explain part of it.\n\nBehavioral addiction\nThe term behavioral addiction refers to a compulsion to engage in a natural reward despite adverse consequences.: ch. 16\n\nAddiction can exist without psychotropic drugs, an idea that was popularized by psychologist Stanton Peele. These are termed behavioral addictions. Such addictions may be passive or active, but they commonly contain reinforcing features, which are found in most addictions. Sexual behavior, eating, gambling, playing video games, and shopping are all associated with compulsive behaviors in humans and have been shown to activate the mesolimbic pathway and other parts of the reward system. Diagnostic manuals recognize only some of these as disorders. Gambling disorder is the only behavioral addiction classified as a clinical disorder in the DSM-5-TR, which lists internet gaming disorder as a condition requiring further study; the ICD-11 classifies both gambling disorder and gaming disorder as disorders due to addictive behaviors. Compulsive sexual behavior disorder, compulsive buying–shopping disorder, and problematic use of social media are discussed in the research literature as candidate addictive disorders, but are not classified as addictions in either manual.\n\nFood addiction\nWhether food can be addictive is disputed. Neither the DSM-5-TR nor the ICD-11 recognizes a food or eating addiction, and researchers disagree about whether the concept is best framed as an addiction to specific foods, a pattern of disordered eating, or neither. Proponents argue that ultra-processed foods high in refined carbohydrate and fat meet the criteria conventionally used to identify an addictive substance, because processing delivers these nutrients faster and in higher concentrations than they occur in nature. Critics respond that no single constituent has been isolated as the addictive agent, unlike the case for a drug. Most research uses the Yale Food Addiction Scale, which applies the DSM-5 criteria for substance use disorder to eating. Food addiction as measured this way overlaps with, but is not the same as, binge eating disorder: not everyone with an eating disorder screens positive, and not everyone screening positive has a diagnosed eating disorder.\n\nCauses\n\nSeveral genetic and environmental risk factors exist for developing an addiction. Genetic and environmental risk factors each account for roughly half of an individual's risk for developing an addiction; the contribution from epigenetic risk factors to the total risk is unknown. Even in individuals with a relatively low genetic risk, exposure to sufficiently high doses of an addictive drug for a long period of time (e.g., weeks–months) can result in an addiction.\n\nGenetic factors\nGenetic factors, along with socio-environmental (e.g., psychosocial) factors, have been established as significant contributors to addiction vulnerability. Addiction is substantially heritable. Twin and adoption studies estimate the heritability of alcohol use disorder at approximately 50%, with comparable estimates across other substances. This risk is polygenic: it reflects the combined small effects of many common variants rather than any single gene.\n\nGenome-wide association studies (GWAS) are used to examine genetic associations with dependence, addiction, and drug use, and have begun to map this architecture, and distinguish loci associated with a broad general liability to addiction across substances from loci conferring risk for a specific drug. Individual common variants each contribute only a small increment of risk, so genetic vulnerability is best understood as an aggregate rather than as the effect of any identified gene.\n\nEnvironmental factors\nEnvironmental risk factors for addiction are the experiences of an individual during their lifetime that interact with the individual's genetic composition to increase or decrease their vulnerability to addiction. Several environmental factors have been implicated as risk factors for addiction, including various psychosocial stressors. The National Institute on Drug Abuse lists early aggressive behavior, lack of parental supervision, peer substance use, the availability of substances, and poverty as risk factors for substance use among children and adolescents.\n\nAdverse childhood experiences, as defined by the Adverse Childhood Experiences Study, show a graded dose–response association with later harm. A meta-analysis pooling more than 250,000 participants found that people reporting four or more such experiences were at increased risk of every health outcome examined, with the strongest associations for problematic drug use. Chronic childhood exposure to physical, emotional, or sexual abuse, physical or emotional neglect, witnessing violence in the household, or a parent being incarcerated or having a mental illness is associated with substance use disorder in adolescence and adulthood, and people in treatment for addiction report such experiences far more often than the general population. Impaired emotion regulation and reduced impulse control are among the proposed pathways, with substance use adopted as a way of coping, particularly during adolescence. Many children who experience abuse go on to develop an addiction in adolescence or adult life. This pathway towards addiction that is opened through stressful experiences during childhood can be avoided by a change in environmental factors throughout an individual's life and opportunities of professional help.\n\nSocial and environmental influences include family dynamics, early and adverse experiences, socioeconomic status, peer networks, and cultural norms. Adverse childhood exposures and maladaptive developmental trajectories are robust environmental influences on the development of alcohol use disorder, and adverse childhood experiences are recognized more generally as a social determinant of vulnerability to substance use disorders. Social networks exert a bidirectional influence, while wider sociocultural factors (including public-health control policies and the social determinants of health) shape both exposure and outcome. Because social risk factors are modifiable, prevention that targets them in childhood and adolescence can reduce the risk of later disorder. Together, these levels of analysis present addiction as a dynamic condition emerging from the interaction of neurobiological processes, individual psychological traits and broader social environments. Social factors act largely through chronic stress, peer modeling, socioeconomic constraint and the availability of substances, influencing both the likelihood of exposure and the risk of escalation or relapse.\n\nStress and addiction\nStress contributes to both the development and the persistence of addiction, affecting neurophysiological pathways, decision-making and relapse risk. Acute and chronic stress activate the hypothalamic–pituitary–adrenal axis, raising levels of cortisol and corticotropin-releasing hormone; these changes alter reward processing and increase the motivational pull of substances, particularly those that temporarily relieve negative mood.\n\nIn animal studies, repeated stress exposure increases dopamine release in the nucleus accumbens and sensitizes the mesolimbic reward system, making drugs more reinforcing. Chronic stress also disturbs glutamatergic signaling in the prefrontal cortex, impairing inhibitory control and self-regulation, which increases susceptibility to compulsive drug seeking and reduces the ability to disregard drug-associated cues.\n\nStress is among the more reliable predictors of relapse. In human neuroimaging studies, stress-induced activation of the amygdala together with reduced prefrontal regulation is associated with self-reported craving and with subsequent return to use. People with a history of trauma, or of chronic social stress such as discrimination, poverty or housing insecurity, are at increased risk of substance use disorders.\n\nBecause stress interacts with reward circuitry and decision-making systems, many treatment approaches incorporate stress-reduction strategies, including cognitive behavioral therapy, mindfulness-based interventions and medications acting on stress-related neurochemistry.\n\nDevelopmental stage\nAdolescence is the period of greatest risk both for first use of an addictive drug and for the transition to disordered use. The prefrontal cortex, which supports planning, inhibitory control and the weighing of long-term consequences, develops more slowly than the brain's reward circuitry and is not fully mature until the mid-twenties. During this window sensitivity to reward is high while cognitive control is still developing, which contributes to greater risk-taking, including experimentation with drugs. Drug exposure in early adolescence can in turn disturb cortical development and delay prefrontal maturation, and prefrontal dysfunction in adolescents is itself associated with a higher risk of substance use disorder.\n\nComorbid disorders\nPeople with comorbid mental health conditions such as depression, anxiety, attention deficit hyperactivity disorder or post-traumatic stress disorder are more likely to develop substance use disorders.\n\nMechanisms\nAddiction develops when repeated exposure to a rewarding stimulus produces lasting changes in the brain circuits that govern reward, stress and self-control. Current accounts describe this as a recurring three-stage cycle. During binge/intoxication, dopaminergic signaling in the basal ganglia gives the drug and the cues surrounding it a powerful pull on attention and behavior. During withdrawal/negative affect, brain stress systems in the extended amygdala become overactive and ordinary pleasures become muted, so that use is increasingly driven by relief rather than reward. During preoccupation/anticipation, reduced prefrontal cortex control over these systems leaves craving poorly restrained and makes relapse more likely. Each stage is associated with persistent changes in gene expression and synaptic plasticity within the affected circuits. In laboratory animals, repeated drug exposure causes a protein called ΔFosB to accumulate in reward-related neurons, which increases drug self-administration and blunts sensitivity to adverse consequences; it is used in preclinical research as a marker of addiction.\n\nReward circuitry\nThe reinforcing effects of most addictive drugs depend on dopamine signaling in the nucleus accumbens, the same pathway that responds to natural rewards such as food and sex. Altered dopamine neurotransmission is frequently observed following the development of an addictive state. In people and in animals that have developed an addiction, altered dopamine or opioid neurotransmission is evident in the nucleus accumbens and elsewhere in the striatum.\n\nCognitive and stimulus control\nCognitive control and stimulus control, which is associated with operant and classical conditioning, represent opposite processes (i.e., internal vs external or environmental, respectively) that compete over the control of an individual's elicited behaviors. Cognitive control, and particularly inhibitory control over behavior, is impaired in both addiction and attention deficit hyperactivity disorder.: ch. 14  Stimulus-driven behavioral responses (i.e., stimulus control) that are associated with a particular rewarding stimulus tend to dominate one's behavior in an addiction.: ch. 14 \n\nIn operant conditioning, behavior is influenced by outside stimuli, such as a drug. The operant conditioning theory of learning is useful in understanding why the mood-altering or stimulating consequences of drug use can reinforce continued use (an example of positive reinforcement) and why the addicted person seeks to avoid withdrawal through continued use (an example of negative reinforcement). Stimulus control is using the absence of the stimulus or the presence of a reward to influence the resulting behavior.\n\nCognitive control is the intentional selection of thoughts, behaviors and emotions in response to the environment. Drugs alter both the function and the structure of the brain. Cognitive functions such as learning, memory, and impulse control, are affected by drugs. These effects promote drug use, as well as hinder the ability to abstain from it. The increase in dopamine release is prominent in drug use, specifically in the ventral striatum and the nucleus accumbens. Dopamine release in this pathway is more closely tied to motivation — the \"wanting\" of a reward — than to the pleasure, or \"liking\", that the reward itself produces, which depends on separate brain systems. Addictive drugs cause a significant increase in this reward system, causing a large increase in dopamine signaling as well as increase in reward-seeking behavior, in turn motivating drug use. This promotes the development of a maladaptive drug to stimulus relationship. Early drug use leads to these maladaptive associations, later affecting cognitive processes used for coping, which are needed to abstain from them successfully.\n\nMesocorticolimbic pathway\nUnderstanding the pathways in which drugs act and how drugs can alter those pathways is key when examining the biological basis of drug addiction. The reward pathway, known as the mesolimbic pathway, or its extension, the mesocorticolimbic pathway, is characterized by the interaction of several areas of the brain.\n\nDopaminergic neurons in the ventral tegmental area (VTA) fire in response to cues that predict a reward and project to the nucleus accumbens through the mesolimbic pathway; nearly all addictive drugs increase dopamine release along this pathway, although they act on it by different routes. The nucleus accumbens, made up largely of GABAergic medium spiny neurons, is a principal target of these projections and is involved in learning conditioned responses to drug-associated cues, and in the growing sensitivity to those cues as addiction progresses. A further target is the prefrontal cortex, including the anterior cingulate and orbitofrontal cortices, which weighs competing information in determining whether a behavior is carried out and forms the associations between drug reward and environmental cues that give those cues their power. These cues are strong mediators of drug-seeking behavior and can trigger relapse even after months or years of abstinence.\n\nRole of dopamine and glutamate\nDopamine is the primary neurotransmitter of the brain's reward system, and also has roles in movement, emotion, cognition and motivation. Natural rewards such as eating, and recreational drug use, both trigger dopamine release, which underlies their reinforcing quality.\n\nExcessive intake of many types of addictive drugs results in repeated release of high amounts of dopamine, which in turn affects the reward pathway directly through heightened dopamine receptor activation. Prolonged and abnormally high levels of dopamine in the synaptic cleft can induce receptor downregulation in the neural pathway. Downregulation of mesolimbic dopamine receptors can result in a decrease in the sensitivity to natural reinforcers.\n\nDrug seeking is driven by glutamatergic projections from the prefrontal cortex to the nucleus accumbens, and chronic drug exposure produces lasting glutamate-mediated changes along this route.\n\nNeuroadaptation and sensitization\nReward sensitization is a process that causes an increase in the amount of reward (specifically, incentive salience) that is assigned by the brain to a rewarding stimulus (e.g., a drug). In simple terms, when reward sensitization to a specific stimulus (e.g., a drug) occurs, an individual's \"wanting\" or desire for the stimulus itself and its associated cues increases.: ch. 16 Reward sensitization normally occurs following chronically high levels of exposure to the stimulus.\n\nOn the incentive-sensitization account, \"cue-induced wanting\" or \"cue-triggered wanting\" – a form of craving triggered by drug-associated cues – drives much of the compulsive behavior seen in addiction.\n\nDuring the development of an addiction, the repeated association of otherwise neutral and even non-rewarding stimuli with drug consumption triggers an associative learning process that causes these previously neutral stimuli to act as conditioned positive reinforcers of addictive drug use (i.e., these stimuli start to function as drug cues). As conditioned positive reinforcers of drug use, these previously neutral stimuli are assigned incentive salience (which manifests as a craving) – sometimes at pathologically high levels due to reward sensitization – which can transfer to the primary reinforcer (e.g., the use of an addictive drug) with which it was originally paired. Incentive sensitization is one of several competing accounts of addiction. A 2025 review by the theory's originators sets it against opponent-process theories, habit theories, and theories centered on impaired prefrontal control, and addresses continuing debate over whether craving is central to addiction and whether addictive behavior is accurately described as compulsive.\n\nIn contrast to ΔFosB's reward-sensitizing effect, CREB transcriptional activity decreases user's sensitivity to the rewarding effects of the substance. CREB transcription in the nucleus accumbens is implicated in psychological dependence and symptoms involving a lack of pleasure or motivation during drug withdrawal.\n\nMolecular and epigenetic mechanisms\nRepeated drug exposure changes how genes are switched on and off in the brain's reward circuits without altering the underlying DNA sequence, a set of processes known as epigenetic regulation. Three kinds of change have been implicated: chemical modification of the histone proteins around which DNA is wound, methylation of the DNA itself, and altered levels of small regulatory molecules called microRNAs.\n\nIn rodents, some drug-induced epigenetic marks can be passed from parent to offspring and alter the offspring's response to the same drug, in some experiments reducing rather than increasing their drug taking. Neither the inheritance of these marks in humans nor their behavioral effects has been established.\n\nTheories and models\nThe brain disease model of addiction posits that an individual's exposure to an addictive drug is the most significant environmental risk factor for addiction. In a review in The New England Journal of Medicine, Marc Lewis argued that the brain disease model gives a misleading and incomplete account, and that the brain changes it describes are better understood as a form of learning. Lewis was among a group of researchers who launched the Addiction Theory Network in 2018 to challenge the model and argue that addiction is better explained by choice, learning and social context.\n\nPsychological theories\nThe psychoanalytic theory model defines addiction as a form of defense against feelings of hopelessness and helplessness as well as a symptom of failure to regulate powerful emotions related to adverse childhood experiences (ACEs), various forms of maltreatment and dysfunction experienced in childhood. In this case, the addictive substance provides brief but total relief and positive feelings of control.\n\nPsychological contributions include learning and conditioning processes, impulsivity, reward sensitivity, and the use of substances to cope with negative mood or trauma. Conditioning models hold that environmental cues can acquire motivational significance of their own and trigger craving and relapse even after long periods of abstinence. Reviews of alcohol use disorder identify overvaluation of the drug's reinforcing effects, elevated impulsivity across several dimensions, the acute effects of stress and environmental triggers, and a lack of alternative rewarding activities as well-established psychological determinants, and present these processes as interacting with biological and social vulnerabilities, each reinforcing the others.\n\nPersonality theories\nPersonality theories of addiction are psychological models that associate personality traits or modes of thinking (i.e., affective states) with an individual's proclivity for developing an addiction. Data analysis demonstrates that psychological profiles of drug users and non-users have significant differences, and the psychological predisposition to using different drugs may be different. Models of addiction risk that have been proposed in psychology literature include: an affect dysregulation model of positive and negative psychological affects, the reinforcement sensitivity theory of impulsiveness and behavioral inhibition, and an impulsivity model of reward sensitization and impulsiveness.\n\nSocial learning theory\nSocial learning theory, as originally proposed by Albert Bandura, holds that behavior is shaped by the reciprocal relationships between personal factors, the external environment, and the behavior itself (a principle known as reciprocal determinism). Applied to addiction, this frames drug use as arising from the interaction between an individual's personal characteristics, their social environment, and drug-related behavior itself, and characterizes addiction as a chronically evolving biopsychosocial disorder. On this account, effective treatment should target every node of the model and the relationships between them, rather than any single factor in isolation.\n\nSocial control theory\nAccording to Travis Hirschi's social control theory, adolescents with stronger attachments to family, religious, academic, and other social institutions are less likely to engage in delinquent and maladaptive behavior, such as drug use leading to addiction.\n\nEvolutionary perspectives\nSome scholars have proposed evolutionary explanations for addiction, suggesting that vulnerabilities to substance or behavioral dependence reflect by-products or dysregulated expressions of reward and learning systems that were adaptive in ancestral environments. A 2024 review characterizes most such accounts as versions of evolutionary mismatch, in which substances and activities that are evolutionarily novel in their purity, potency or availability act on reward systems shaped under very different conditions, and extends the argument from substances to behavioral addictions. Within that framework, Nesse and Berridge argued that purified drugs and direct routes of administration bypass the systems that ordinarily evaluate experience, giving a \"false signal of a fitness benefit\" that hijacks the brain mechanisms underlying wanting and liking. Other reviews emphasize how psychoactive substances and behavioral reinforcers act on conserved mechanisms for reward, reinforcement, and emotion, which in modern settings can be overstimulated or maladapted. These perspectives do not replace proximate neurobiological models, but aim instead to situate contemporary patterns of vulnerability within a broader evolutionary framework."}]};</script>

  ray.setFromCamera(mouse, camera);

    const f = (d - e.rest) * e.k * alpha / d;
    e.a.v.x += dx*f; e.a.v.y += dy*f; e.a.v.z += dz*f;
    e.b.v.x -= dx*f; e.b.v.y -= dy*f; e.b.v.z -= dz*f;
  }
  for (let i = 0; i < hubList.length; i++) for (let j = i + 1; j < hubList.length; j++) {
    const A = hubList[i], B = hubList[j];                         // unlinked centrals/meta: weak pull toward a compact group
    if (hubLinks.has(hubKey(A, B))) continue;
    const pa = A.mesh.position, pb = B.mesh.position;
    const dx = pb.x-pa.x, dy = pb.y-pa.y, dz = pb.z-pa.z, d = Math.sqrt(dx*dx+dy*dy+dz*dz) || 1;
    const f = (d - HUB_REST) * HUB_PULL * alpha / d;
    A.v.x += dx*f; A.v.y += dy*f; A.v.z += dz*f;
    B.v.x -= dx*f; B.v.y -= dy*f; B.v.z -= dz*f;
  }
  for (const n of nodes) n.v.sub(n.v0).multiplyScalar(nodeDt(n)).add(n.v0);   // forces act over the time step
  for (const n of nodes) {
    const p = n.mesh.position, dt = nodeDt(n), ga = alpha * dt;
    if (n.core) { const g = GRAVITY*ga; n.v.x -= p.x*g; n.v.y -= p.y*g; n.v.z -= p.z*g; }
    else {
      const h = byId.get(n.cl);
      if (h) { const q = h.mesh.position, g = THEME_HOME*ga; n.v.x -= (p.x-q.x)*g; n.v.y -= (p.y-q.y)*g; n.v.z -= (p.z-q.z)*g; }
    }
    n.v.multiplyScalar(Math.pow(DAMP, dt));
    const s = n.v.length(); if (s > VMAX) n.v.multiplyScalar(VMAX / s);
    if (n.core && n.kind !== 'meta') n.v.y -= p.y * 3 * ga;                  // centrals: flattened onto one plane
    if (n.kind === 'meta') n.v.y -= (p.y - 12) * 0.3 * ga;                   // meta: held above the plane
    if (!n.pinned) p.addScaledVector(n.v, dt);
  }
}
/* camera motion -> small swirl impulse on nodes (inertia when you rotate the view) */
const prevDir = new THREE.Vector3(), curDir = new THREE.Vector3(), axis = new THREE.Vector3(), swirl = new THREE.Vector3();
function cameraInertia() {
  curDir.copy(camera.position).sub(controls.target).normalize();
  axis.crossVectors(prevDir, curDir);
  const ang = Math.asin(Math.min(1, axis.length()));
  prevDir.copy(curDir);
  if (ang < 1e-4) return;
  axis.normalize().multiplyScalar(Math.min(ang, .08) * 0.06);
  for (const n of nodes) { swirl.crossVectors(axis, n.mesh.position); n.v.add(swirl); }
  if (ang > 0.02) alpha = Math.max(alpha, .08);
}

/* ------------------------------------------------------------ render loop */
const ease = k => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
let bars = [];                                                 // one cylinder per Meta-Central link
function rebuildBars() {
  bars.forEach(b => { scene.remove(b); b.material.dispose(); });
  bars = edges.filter(e => e.bar).map(e => {
    const mesh = new THREE.Mesh(BAR_GEO, new THREE.MeshBasicMaterial({ color: BAR_COLOR, transparent: true, opacity: 0, depthWrite: false }));
    mesh.userData.edge = e;
    scene.add(mesh);
    return mesh;
  });
}
function updateBars(now) {
  const up = new THREE.Vector3(0, 1, 0), dir = new THREE.Vector3();
  bars.forEach(b => {
    const e = b.userData.edge, p = e.a.mesh.position, q = e.b.mesh.position;
    dir.copy(q).sub(p);
    const len = dir.length() || 1e-3;
    b.position.copy(p).add(q).multiplyScalar(0.5);
    b.quaternion.setFromUnitVectors(up, dir.divideScalar(len));
    b.scale.set(1, len, 1);
    b.material.opacity = 0.92 * ease((now - edgesBorn - 500) / 900);
  });
}
function updateEdgeGeometry(now) {
  if (!lines) return;
  const a = lines.geometry.attributes.position.array;
  edges.forEach((e, i) => {
    const p = e.a.mesh.position, q = e.hidden ? e.a.mesh.position : e.b.mesh.position;   // hidden links collapse to a point
    a[i*6]=p.x; a[i*6+1]=p.y; a[i*6+2]=p.z; a[i*6+3]=q.x; a[i*6+4]=q.y; a[i*6+5]=q.z;
  });
  lines.geometry.attributes.position.needsUpdate = true;
  lines.material.opacity = .8 * ease((now - edgesBorn - 500) / 900);
}
function updateNodes(now) {
  const W = innerWidth, H = innerHeight, t = now * 0.001;
  for (const n of nodes) {
    if (n.mesh.userData.spin) n.mesh.rotateOnAxis(n.mesh.userData.spin.axis, n.mesh.userData.spin.rate);
    const k = ease((now - n.born) / 900);
    n.mesh.scale.setScalar(Math.max(n.rDraw * k, 0.001));
    n.glow.scale.setScalar(n.core ? (n.kind === 'core' ? (n === selected ? 6.36 : 4.86) : (n === selected ? 10.2 : 7.8)) : (n === selected ? 18.36 : 13.57));   // Central/Meta aurora at 60%, Orbital at 40%
    const base = (KIND[n.kind] || KIND.theme).gop;
    n.glow.material.opacity = (base + Math.sin(t*1.3 + n.mesh.position.x*.05) * .06) * k;
    tmp.copy(n.mesh.position).project(camera);
    if (tmp.z > 1 || Math.abs(tmp.x) > 1.1 || Math.abs(tmp.y) > 1.1) { n.el.style.display = 'none'; continue; }
    const dist = camera.position.distanceTo(n.mesh.position);
    const far = Math.min(1, Math.max(.25, 1.3 - dist/300));
    const op = (n === selected || n.core ? 1 : 1 - 0.7*(1 - far)) * k;     // fade softened by 30%
    const x = (tmp.x*.5+.5)*W, y = (-tmp.y*.5+.5)*H + 8 + n.r * 4.5;
    n.el.style.display = 'block';
    n.el.style.opacity = op.toFixed(2);
    n.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translateX(-50%)`;
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!press) recentre();
  updateFlight(now);
  controls.update();
  applyViewShift();
  if (!flight && !controls.autoRotate) cameraInertia();   // only a manual camera move nudges the nodes
  if (controls.autoRotate) alpha = Math.max(alpha, 0.06);   // keep the springs active while spinning, so nodes stay at their distance
  SIM_DT = 0.2; simulate(); SIM_DT = 1;
  updateEdgeGeometry(now); updateBars(now); updateNodes(now);
  stars[0].rotation.y += 0.00007; stars[1].rotation.y -= 0.00004;
  composer ? composer.render() : renderer.render(scene, camera);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) { composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight); }
});

/* ------------------------------------------------------------ boot */
let initial = DEFAULT_TEXT;
try { const s = localStorage.getItem(STORE); if (s && TM.validate(s).ok) initial = s; } catch (e) {}
src.value = initial;
updateCount();
if (!generate(initial, false)) { src.value = DEFAULT_TEXT; generate(DEFAULT_TEXT, false); }
requestAnimationFrame(frame);
})();

</script>
</body>
