<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<title>{{TITLE}}</title>
<style>
  :root{
    --bg:#05060a; --fg:#ecebe6; --dim:#8b887d; --gold:#d9b66a;
    --panel:rgba(14,15,20,.80); --line:rgba(236,235,230,.13);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font:24.7px/1.5 'Newsreader',Georgia,serif;
    -webkit-font-smoothing:antialiased;font-optical-sizing:auto;letter-spacing:.01em}
  canvas{display:block;touch-action:none}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .label{position:absolute;left:0;top:0;white-space:nowrap;font-size:22.8px;letter-spacing:.02em;
    color:var(--fg);text-shadow:0 0 8px #000,0 0 3px #000;will-change:transform,opacity}
  .label.k-theme{color:#cfc9b8}
  #card .ctx{color:var(--dim)}
  .label.k-theme.mlink{color:#d86c1a}
  .label.k-theme{font-size:21px;z-index:1}
  .label.k-core{z-index:2}
  .label.k-meta{z-index:3}
  .label.core{font-size:32.3px;font-weight:650;color:#fffdf4;letter-spacing:.05em;
    text-shadow:0 0 16px rgba(217,182,106,.6),0 0 3px #000}
  .label.core.k-meta{color:#d86c1a;text-shadow:0 0 16px rgba(216,108,26,.6),0 0 3px #000}
  .label.sel{font-weight:600}

  .glass{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:12px}
  button,input,textarea{font:inherit;color:inherit}
  button{background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 14px;
    cursor:pointer;color:var(--fg);transition:background .15s,border-color .15s,color .15s}
  button:hover:not(:disabled){background:rgba(255,255,255,.07)}
  button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  button.on{border-color:var(--gold);color:var(--gold)}
  button.primary{background:rgba(217,182,106,.14);border-color:rgba(217,182,106,.45);color:var(--gold)}
  button.primary:hover:not(:disabled){background:rgba(217,182,106,.24)}
  button.link{padding:0;border:0;border-radius:4px;color:var(--dim);text-decoration:underline;
    text-underline-offset:3px;font-size:12.5px}
  button.link:hover:not(:disabled){background:transparent;color:var(--fg)}

  #toolbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;z-index:6;font-size:13px}

  /* text overlay: collapses/expands smoothly */
  #editor{position:fixed;top:66px;bottom:64px;left:50%;transform:translateX(-50%);width:min(1020px,calc(100vw - 24px));font-size:12.5px;
    z-index:5;display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;
    transition:grid-template-rows .38s cubic-bezier(.3,.7,.2,1),opacity .25s,visibility 0s .38s}
  #editor.open{grid-template-rows:1fr;opacity:1;visibility:visible;
    transition:grid-template-rows .38s cubic-bezier(.3,.7,.2,1),opacity .25s,visibility 0s}
  #editor .clip{overflow:hidden;min-height:0;display:flex;flex-direction:column}
  #editor .body{padding:14px;flex:1;min-height:0;display:flex;flex-direction:column}
  textarea{display:block;width:100%;flex:1 1 auto;min-height:120px;resize:none;font-size:12.5px;background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.55}
  textarea::placeholder{color:var(--dim)}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--dim);gap:10px}
  #count.ok{color:var(--gold)}
  #msg{min-height:20px;margin-top:6px;color:#e59a8b;font-size:12.5px}
  .note{margin:0;font-size:12.5px;color:var(--dim);text-align:right}
  .actions{display:flex;justify-content:flex-end;gap:6px}
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .samples{display:flex;gap:6px;flex-wrap:wrap}
  .sample-btn{font-size:12.5px;padding:7px 14px;border:1px solid var(--line);border-radius:8px;color:var(--dim)}
  .sample-btn.on{border-color:var(--gold);color:var(--gold)}
  .sample-btn:hover:not(:disabled){color:var(--fg)}

  #card{position:fixed;left:14px;bottom:14px;width:min(342px,calc(100vw - 28px));padding:14px;display:none;
    z-index:4;max-height:calc(100vh - 110px);overflow:auto}
  #card.open{display:block}
  #card .kind{font-size:12px;color:var(--dim)}
  #card h3{margin:2px 0 8px;font-size:16px;font-weight:600;color:var(--gold);overflow-wrap:anywhere}
  #card p{margin:0 0 8px;color:#c9c6bb;font-size:12.5px}
  .hl{color:#f0954a;font-style:italic}
  .ind{color:#f0954a;font-style:normal}
  #card .rel{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  #card .rel button{padding:2px 10px;border:1px solid var(--line);border-radius:99px;font-size:12px}

  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:8px 14px;color:var(--dim);
    font-size:12px;text-align:center;max-width:calc(100vw - 24px);z-index:3;display:flex;gap:14px;
    flex-wrap:wrap;justify-content:center;align-items:center}
  #hint .lg{display:inline-flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot.core{width:12px;height:12px;background:#fff3dc;box-shadow:0 0 10px 2px rgba(232,196,112,.75)}
  .dot.theme{background:#8cc4ee;box-shadow:0 0 5px rgba(29,74,140,.6)}
  .dot.meta{width:12px;height:12px;background:#d86c1a;box-shadow:0 0 10px 2px rgba(216,108,26,.75)}
  #toast{position:fixed;font-size:13px;top:72px;left:50%;transform:translate(-50%,-6px);padding:8px 14px;opacity:0;
    pointer-events:none;transition:opacity .2s,transform .2s;z-index:7}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:720px){ #card{bottom:78px} #hint{bottom:10px} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div id="labels"></div>

<div id="toolbar" class="glass" role="toolbar" aria-label="Tools">
  <button id="bText" class="primary" aria-expanded="false" aria-controls="editor">Enter text</button>
  <button id="bRotate" class="on" title="Slowly spin the view">Spin</button>
  <button id="bFast" title="Spin 20 times faster">Spin 20x</button>
  <button id="bReset" title="Restore the default camera view">Reset</button>
</div>

<div id="editor" class="glass" role="dialog" aria-label="Text to network" aria-hidden="true">
  <div class="clip"><div class="body">
    <div class="toprow">
      <div id="samples" class="samples"></div>
      <div class="actions">
        <button id="close">Close</button>
        <button id="update" class="primary">Update</button>
      </div>
    </div>
    <textarea id="src" spellcheck="false" aria-label="Your text"
      placeholder="Paste or type any text: an article, meeting notes, a story… ({{MIN_WORDS}} to {{MAX_WORDS}} words)"></textarea>
    <div class="meta">
      <span id="count"></span>
      <span class="note">Tiny on-page model for summaries: a simple showcase, not for serious production. Your text stays in this page.</span>
    </div>
    <div id="msg" role="alert"></div>
  </div></div>
</div>

<div id="card" class="glass" aria-live="polite"></div>

<div id="hint" class="glass">
  <span class="lg"><i class="dot core"></i>Central</span>
  <span class="lg"><i class="dot theme"></i>Orbital</span>
  <span class="lg"><i class="dot meta"></i>Meta</span>
  <span>Drag to rotate · scroll to zoom · click a node</span>
</div>
<div id="toast" class="glass" role="status"></div>

<!-- ======================= THE TINY MODEL (pure JS, no dependencies) ======================= -->
<script>window.NETWORK_CONFIG = {{CONFIG_JSON}};</script>
<script>
{{MODEL_JS}}
</script>

{{LIBS}}

<!-- ======================= THE 3D VIEW AND UI ======================= -->
<script>
{{VIEWER_JS}}
</script>
</body>
</html>
